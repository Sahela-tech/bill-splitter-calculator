<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bill Splitter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>💸 Smart Bill Splitter</h1>
        <p class="subtitle">Split bills easily with friends, custom tips & currency selection!</p>

        <div class="card">
            <div class="input-group">
                <label for="currency">Currency</label>
                <select id="currency" class="select-input">
                    <option value="Rs. ">LKR (Rs.)</option>
                    <option value="$">$ (USD)</option>
                    <option value="€">€ (EUR)</option>
                    <option value="£">£ (GBP)</option>
                    <option value="₹">₹ (INR)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="billTotal">Total Bill Amount</label>
                <input type="number" id="billTotal" placeholder="0.00" min="0" step="0.01">
            </div>

            <div class="input-group">
                <label for="tipPercent">Tip Percentage (%)</label>
                <div class="tip-buttons">
                    <button type="button" class="tip-btn" data-tip="0">0%</button>
                    <button type="button" class="tip-btn" data-tip="5">5%</button>
                    <button type="button" class="tip-btn active" data-tip="10">10%</button>
                    <button type="button" class="tip-btn" data-tip="15">15%</button>
                </div>
                <input type="number" id="customTip" placeholder="Custom Tip %" min="0">
            </div>

            <div class="input-group">
                <label for="peopleCount">Number of People</label>
                <input type="number" id="peopleCount" value="2" min="1">
            </div>

            <button id="calculateBtn" class="primary-btn">Calculate Split</button>
        </div>

        <div class="result-card" id="resultCard">
            <h2>Breakdown</h2>
            <div class="result-row">
                <span>Tip Amount:</span>
                <span class="val"><span class="curr-symbol">Rs. </span><span id="tipAmount">0.00</span></span>
            </div>
            <div class="result-row">
                <span>Total Amount (Inc. Tip):</span>
                <span class="val"><span class="curr-symbol">Rs. </span><span id="grandTotal">0.00</span></span>
            </div>
            <hr>
            <div class="result-row highlight">
                <span>Each Person Pays:</span>
                <span class="val-large"><span class="curr-symbol">Rs. </span><span id="perPerson">0.00</span></span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
